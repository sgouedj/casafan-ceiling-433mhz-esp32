# ============================================================
# SORTIES
# ============================================================

output:

  # LED BLUE intégrée (STATUS_LED)
  - platform: gpio
    id: STATUS_LED
    pin: GPIO8
    inverted: true

  # Sortie virtuelle de la lumière
  - platform: template
    id: casafan_light_output
    type: binary
    write_action:
      - script.execute: casafan_lumiere


# ============================================================
# VENTILATEUR
# ============================================================

fan:

  - platform: template
    name: "Casafan Ventilateur"
    id: casafan_fan
    icon: "mdi:ceiling-fan"

    restore_mode: ALWAYS_OFF

    # ON = V1
    on_turn_on:
      then:
        - script.execute: casafan_v1

    # OFF = STOP
    on_turn_off:
      then:
        - script.execute: casafan_stop


# ============================================================
# LUMIERE
# ============================================================

light:

  - platform: binary
    name: "Casafan Lumière"
    id: casafan_light
    output: casafan_light_output
    restore_mode: RESTORE_DEFAULT_OFF


# ============================================================
# ROTATION
# ============================================================

switch:
  - platform: template
    name: "Casafan Rotation"
    id: casafan_rotation_switch
    icon: "mdi:rotate-3d"
    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:
      - if:
          condition:
            lambda: 'return id(system_ready);'
          then:
            - script.execute: casafan_rotation

    turn_off_action:
      - if:
          condition:
            lambda: 'return id(system_ready);'
          then:
            - script.execute: casafan_rotation
# ============================================================
# 6 boutons vitesse
# ============================================================

button:
