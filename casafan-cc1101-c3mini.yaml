# ============================================================
# CASAFAN CC1101 - ESP32-C3 mini
# TRANSMITTER & RECEIVER RF 
# ============================================================
# CC1101	Fonction	ESP32-C3
# 1 GND	    Masse	    GND
# 2 VCC	    Alim     	3V3
# 3 GDO0	TX RF	    GPIO7
# 4 CSN	    Chip Select	GPIO3
# 5 SCK	    SPI Clock	GPIO4
# 6 MOSI	SPI MOSI	GPIO6
# 7 MISO	SPI MISO	GPIO5
# 8 GDO2	RX	RF      GPIO10
# ============================================================

esphome:
  name: casafan-cc1101-c3mini
  friendly_name: CasaFan CC1101 C3mini
  comment: "ESP32-C3 with CC1101 TI SMA - TRANSMITTER & RECEIVER RF for ceiling Casafan"
  area:
    id: "chambre_parentale"
    name: "Chambre"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(system_ready) = true;
          
esp32:
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200

api:
  encryption:
    key: "kOm2BVfrvTIFRqewdr2IZrSxT8DoNIXhC9HAKO/ETcA="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "casa Fallback Hotspot"
    password: "reX0UMeZ4Ph3"

web_server:
  port: 80

captive_portal:
  
globals:
  - id: system_ready
    type: bool
    restore_value: no
    initial_value: 'false'



# ============================================================
# SPI CC1101
# ============================================================

spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5


# ============================================================
# CC1101 TI SMA 433MHZ V2.0
# ============================================================

cc1101:
  cs_pin: GPIO3
  frequency: 433.92MHz
  modulation_type: "ASK/OOK"
  symbol_rate: 5000
  filter_bandwidth: 325kHz
  
# ============================================================
# RECEPTEUR - RECEIVER RF - GPIO10
# ============================================================
remote_receiver:
  pin:
    number: GPIO10
    mode:
      input: true
  dump:
    - raw
  tolerance: 60%
  filter: 10us
  idle: 32767us
  buffer_size: 1kb
  rmt_symbols: 64

# ============================================================
# EMETTEUR RF - TRANSMITTER- GPIO7
# ============================================================

remote_transmitter:
  id: rf_transmitter

  pin:
    number: GPIO7

  carrier_duty_percent: 100%

  eot_level: false

  on_transmit:
    then:
      - cc1101.set_idle
      - remote_transmitter.digital_write: false
      - cc1101.begin_tx
      - script.execute: flash_led

  on_complete:
    then:
      - cc1101.set_idle
      - remote_transmitter.digital_write: true
      - cc1101.begin_rx

# ============================================================
# SCRIPTS
# ============================================================

script:

  # ----------------------------------------------------------
  # BUILT-IN LED INTERNAL
  # ----------------------------------------------------------

  - id: flash_led
    mode: restart
    then:
      - output.turn_on: STATUS_LED
      - delay: 120ms
