    name: "Casafan Vitesse 1"
    icon: "mdi:numeric-1-circle"
    on_press:
      - script.execute: casafan_v1

  - platform: template
    name: "Casafan Vitesse 2"
    icon: "mdi:numeric-2-circle"
    on_press:
      - script.execute: casafan_v2

  - platform: template
    name: "Casafan Vitesse 3"
    icon: "mdi:numeric-3-circle"
    on_press:
      - script.execute: casafan_v3

  - platform: template
    name: "Casafan Vitesse 4"
    icon: "mdi:numeric-4-circle"
    on_press:
      - script.execute: casafan_v4

  - platform: template
    name: "Casafan Vitesse 5"
    icon: "mdi:numeric-5-circle"
    on_press:
      - script.execute: casafan_v5

  - platform: template
    name: "Casafan Vitesse 6"
    icon: "mdi:numeric-6-circle"
    on_press:
      - script.execute: casafan_v6

  - platform: template
    name: "Casafan Mode réception"
    icon: "mdi:antenna"
    on_press:
      - cc1101.begin_rx

  - platform: template
    name: "Casafan Mode émission"
    icon: "mdi:antenna-off"
    on_press:
      - cc1101.set_idle